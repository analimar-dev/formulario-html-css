<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Usuário</title>
    </head>

    <body>

        <section>

            <form action method="get">

                <!-- DADOS PESSOAIS -->
                <fieldset>

                    <legend>Dados Pessoais</legend>

                    <label for="userName">Nome</label>
                    <input
                        type="text"
                        id="userName"
                        name="userName"
                        required>
                    <br><br>

                    <label for="userAge">Idade</label>
                    <input
                        type="number"
                        id="userAge"
                        name="userAge"
                        min="12"
                        max="100"
                        required>
                    <br><br>

                    <label for="birthDate">Data de nascimento</label>
                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate">
                    <br><br>

                    <label for="userEmail">E-mail</label>
                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail"
                        required>
                    <br><br>

                    <label for="userPhoneNumber">Telefone</label>
                    <input
                        type="tel"
                        id="userPhoneNumber"
                        name="userPhoneNumber"
                        pattern="[0-9]{11}"
                        placeholder="DDD + número sem espaços ou hífen">
                    <br><br>

                    <label for="userImage">Upload de foto</label>
                    <input
                        type="file"
                        id="userImage"
                        name="userImage"
                        accept="image/*">

                </fieldset>

                <!-- PERFIL -->
                <fieldset>

                    <legend>Perfil</legend>

                    <p>Gênero:</p>

                    <input
                        type="radio"
                        id="feminino"
                        name="userGender"
                        value="Feminino">

                    <label for="feminino">Feminino</label>

                    <input
                        type="radio"
                        id="masculino"
                        name="userGender"
                        value="Masculino">

                    <label for="masculino">Masculino</label>

                    <input
                        type="radio"
                        id="naoInformar"
                        name="userGender"
                        value="Prefiro não informar">

                    <label for="naoInformar">Prefiro não informar</label>

                    <br><br>

                    <!-- ESTADO CIVIL -->

                    <label for="maritalStatus">Estado civil:</label>

                    <select name="maritalStatus" id="maritalStatus">

                        <option value="notInformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="uniaoEstavel">União estável</option>

                    </select>

                    <label for="userState">Estado:</label>

                    <select id="userState" name="userState" required>

                        <option value>Selecione...</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>

                    </select>

                    <label for="userCity">Cidade:</label>

                    <input
                        type="text"
                        id="userCity"
                        name="userCity"
                        placeholder="Digite sua cidade">

                </fieldset>

                <br>
                <!-- HÁBITOS -->

                <fieldset>

                    <legend>Hábitos</legend>

                    <p>Redes Sociais:</p>

                    <input
                        type="checkbox"
                        id="instagram"
                        name="social"
                        value="instagram">

                    <label for="instagram">Instagram</label>

                    <br>

                    <input
                        type="checkbox"
                        id="facebook"
                        name="social"
                        value="facebook">

                    <label for="facebook">Facebook</label>

                    <br>

                    <input
                        type="checkbox"
                        id="linkedin"
                        name="social"
                        value="linkedin">

                    <label for="linkedin">LinkedIn</label>

                    <br>

                    <input
                        type="checkbox"
                        id="x"
                        name="social"
                        value="x">

                    <label for="x">X</label>
                    <br><br>
                    <label for="musicStyle">Estilo musical:</label>

                    <input
                        list="styleTypes"
                        id="musicStyle"
                        name="userMusicStyle"
                        type="text">

                    <datalist id="styleTypes">
                        <option value="rock">
                            <option value="pop">
                                <option value="samba">
                                    <option value="Sertanejo">
                                    </datalist>

                                    <br><br>

                                    <label for="favoriteColor">Cor
                                        favorita:</label>

                                    <input
                                        type="color"
                                        id="favoriteColor"
                                        name="favoriteColor">

                                </fieldset>

                                <button type="submit">
                                    Enviar
                                </button>

                            </form>

                        </section>

                    </body>

                </html>
