<section>

    <form action method="get">

        <!-- DADOS PESSOAIS -->
        <fieldset>

            <legend>Dados Pessoais</legend>

            <label for="userName">Nome</label>
            <input
                type="text"
                id="userName"
                name="userName"
                required>
            <br><br>

            <label for="userAge">Idade</label>
            <input
                type="number"
                id="userAge"
                name="userAge"
                min="12"
                max="100"
                required>
            <br><br>

            <label for="birthDate">Data de nascimento</label>
            <input
                type="date"
                id="birthDate"
                name="birthDate">
            <br><br>

            <label for="userEmail">E-mail</label>
            <input
                type="email"
                id="userEmail"
                name="userEmail"
                required>
            <br><br>

            <label for="userPhoneNumber">Telefone</label>
            <input
                type="tel"
                id="userPhoneNumber"
                name="userPhoneNumber"
                pattern="[0-9]{11}"
                placeholder="DDD + número sem espaços ou hífen">
            <br><br>

            <label for="userImage">Upload de foto</label>
            <input
                type="file"
                id="userImage"
                name="userImage"
                accept="image/*">

        </fieldset>

        <!-- PERFIL -->
        <fieldset>

            <legend>Perfil</legend>
            <p>Gênero:</p>

            <input
                type="radio"
                id="feminino"
                name="userGender"
                value="Feminino">

            <label for="feminino">Feminino</label>

            <input
                type="radio"
                id="masculino"
                name="userGender"
                value="Masculino">

            <label for="masculino">Masculino</label>

            <input
                type="radio"
                id="naoInformar"
                name="userGender"
                value="Prefiro não informar">

            <label for="naoInformar">Prefiro não informar</label>

        </fieldset>

        <button type="submit">
            Enviar
        </button>

    </form>

</section>
