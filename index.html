<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Usuário</title>
    </head>

    <body>

        <section>

            <form action method="get">

                <!-- DADOS PESSOAIS -->
                <fieldset>

                    <legend>Dados Pessoais</legend>

                    <label for="userName">Nome</label>
                    <input
                        type="text"
                        id="userName"
                        name="userName"
                        required>
                    <br><br>

                    <label for="userAge">Idade</label>
                    <input
                        type="number"
                        id="userAge"
                        name="userAge"
                        min="12"
                        max="100"
                        required>
                    <br><br>

                    <label for="birthDate">Data de nascimento</label>
                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate">
                    <br><br>

                    <label for="userEmail">E-mail</label>
                    <input
                        type="email"
                        id="userEmail"
                        name="userEmail"
                        required>
                    <br><br>

                    <label for="userPhoneNumber">Telefone</label>
                    <input
                        type="tel"
                        id="userPhoneNumber"
                        name="userPhoneNumber"
                        pattern="[0-9]{11}"
                        placeholder="DDD + número sem espaços ou hífen">
                    <br><br>

                    <label for="userImage">Upload de foto</label>
                    <input
                        type="file"
                        id="userImage"
                        name="userImage"
                        accept="image/*">

                </fieldset>

                <!-- PERFIL -->
                <fieldset>

                    <legend>Perfil</legend>

                    <p>Gênero:</p>

                    <input
                        type="radio"
                        id="feminino"
                        name="userGender"
                        value="Feminino">

                    <label for="feminino">Feminino</label>

                    <input
                        type="radio"
                        id="masculino"
                        name="userGender"
                        value="Masculino">

                    <label for="masculino">Masculino</label>

                    <input
                        type="radio"
                        id="naoInformar"
                        name="userGender"
                        value="Prefiro não informar">

                    <label for="naoInformar">Prefiro não informar</label>

                    <br><br>

                    <!-- ESTADO CIVIL -->

                    <label for="maritalStatus">Estado civil:</label>

                    <select name="maritalStatus" id="maritalStatus">

                        <option value="notInformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="uniaoEstavel">União estável</option>

                    </select>

                </fieldset>

                <br>

                <button type="submit">
                    Enviar
                </button>

            </form>

        </section>

    </body>

</html>
